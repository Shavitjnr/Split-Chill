name: Build Snapshot

on:
  push:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build-unix-time: ${{ steps.variable.outputs.build_unix_time }}
      build-date: ${{ steps.variable.outputs.build_date }}
      docker-push: ${{ steps.docker_config.outputs.can_push }}
      docker-image-name: ${{ steps.docker_config.outputs.image_name }}
      docker-version: ${{ steps.meta.outputs.version }}
      docker-tags: ${{ steps.meta.outputs.tags }}
      docker-labels: ${{ steps.meta.outputs.labels }}
      splitchill-ai-docker-bake-meta-file-path: ${{ steps.variable.outputs.splitchill-ai_docker_bake_meta_file_path }}
      splitchill-ai-docker-bake-meta-artifact-name: ${{ steps.variable.outputs.splitchill-ai_docker_bake_meta_artifact_name }}
      splitchill-ai-docker-digests-file-path: ${{ steps.variable.outputs.splitchill-ai_docker_digests_file_path }}
      splitchill-ai-docker-digests-artifact-name-prefix: ${{ steps.variable.outputs.splitchill-ai_docker_digests_artifact_name_prefix }}
      splitchill-ai-package-file-name-prefix: ${{ steps.variable.outputs.splitchill-ai_package_file_name_prefix }}
      splitchill-ai-package-artifact-name-prefix: ${{ steps.variable.outputs.splitchill-ai_package_artifact_name_prefix }}
      splitchill-ai-backend-artifact-name-prefix: ${{ steps.variable.outputs.splitchill-ai_backend_artifact_name_prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine Docker Image and Push Configuration
        id: docker_config
        shell: bash
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE_NAME }}
          DOCKER_USER: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          IMAGE="${DOCKER_IMAGE}"
          if [ -z "$IMAGE" ]; then
            IMAGE="${GITHUB_REPOSITORY,,}"
          fi
          echo "image_name=$IMAGE" >> "$GITHUB_OUTPUT"

          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASS" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.docker_config.outputs.image_name }}
          tags: |
            type=raw,value=SNAPSHOT-{{date 'YYYYMMDD'}}-${{ github.run_id }}
            type=raw,value=SNAPSHOT-{{date 'YYYYMMDD'}}
            type=raw,value=latest-snapshot

      - name: Set up variables
        id: variable
        run: |
          echo "build_unix_time=$(date '+%s')" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "splitchill-ai_docker_bake_meta_file_path=${{ runner.temp }}/bake-meta.json" >> "$GITHUB_OUTPUT"
          echo "splitchill-ai_docker_bake_meta_artifact_name=splitchill-ai-build-dev-docker-bake-meta-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "splitchill-ai_docker_digests_file_path=${{ runner.temp }}/digests" >> "$GITHUB_OUTPUT"
          echo "splitchill-ai_docker_digests_artifact_name_prefix=splitchill-ai-build-dev-digests-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "splitchill-ai_package_file_name_prefix=splitchill-ai-dev-package-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "splitchill-ai_package_artifact_name_prefix=splitchill-ai-build-dev-package-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "splitchill-ai_backend_artifact_name_prefix=splitchill-ai-build-dev-backend-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Rename docker bake meta file
        run: |
          mv "${{ steps.meta.outputs.bake-file }}" "${{ steps.variable.outputs.splitchill-ai_docker_bake_meta_file_path }}"

      - name: Upload docker bake meta artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.variable.outputs.splitchill-ai_docker_bake_meta_artifact_name }}
          path: ${{ steps.variable.outputs.splitchill-ai_docker_bake_meta_file_path }}
          if-no-files-found: error

  build-linux-docker-and-package-x86:
    runs-on: ubuntu-24.04
    needs:
      - setup
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-linux-docker-and-package
        with:
          build-unix-time: ${{ needs.setup.outputs.build-unix-time }}
          build-date: ${{ needs.setup.outputs.build-date }}
          check-3rd-api: ${{ vars.CHECK_3RD_API }}
          skip-tests: ${{ vars.SKIP_TESTS }}
          platform: linux/amd64
          platform-name: linux-amd64
          docker-push: ${{ needs.setup.outputs.docker-push }}
          docker-image-name: ${{ needs.setup.outputs.docker-image-name }}
          docker-username: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          docker-bake-meta-file-path: ${{ needs.setup.outputs.splitchill-ai-docker-bake-meta-file-path }}
          docker-bake-meta-artifact-name: ${{ needs.setup.outputs.splitchill-ai-docker-bake-meta-artifact-name }}
          docker-bake-digests-file-path: ${{ needs.setup.outputs.splitchill-ai-docker-digests-file-path }}
          docker-bake-digests-artifact-name-prefix: ${{ needs.setup.outputs.splitchill-ai-docker-digests-artifact-name-prefix }}
          package-file-name-prefix: ${{ needs.setup.outputs.splitchill-ai-package-file-name-prefix }}
          package-artifact-name-prefix: ${{ needs.setup.outputs.splitchill-ai-package-artifact-name-prefix }}

  build-linux-docker-and-package-arm:
    runs-on: ubuntu-24.04-arm
    needs:
      - setup
    strategy:
      matrix:
        include:
          - platform: linux/arm64/v8
            platform-name: linux-arm64
          - platform: linux/arm/v7
            platform-name: linux-armv7
          - platform: linux/arm/v6
            platform-name: linux-armv6
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-linux-docker-and-package
        with:
          build-unix-time: ${{ needs.setup.outputs.build-unix-time }}
          build-date: ${{ needs.setup.outputs.build-date }}
          check-3rd-api: ${{ vars.CHECK_3RD_API }}
          skip-tests: ${{ vars.SKIP_TESTS }}
          platform: ${{ matrix.platform }}
          platform-name: ${{ matrix.platform-name }}
          docker-push: ${{ needs.setup.outputs.docker-push }}
          docker-image-name: ${{ needs.setup.outputs.docker-image-name }}
          docker-username: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          docker-bake-meta-file-path: ${{ needs.setup.outputs.splitchill-ai-docker-bake-meta-file-path }}
          docker-bake-meta-artifact-name: ${{ needs.setup.outputs.splitchill-ai-docker-bake-meta-artifact-name }}
          docker-bake-digests-file-path: ${{ needs.setup.outputs.splitchill-ai-docker-digests-file-path }}
          docker-bake-digests-artifact-name-prefix: ${{ needs.setup.outputs.splitchill-ai-docker-digests-artifact-name-prefix }}
          package-file-name-prefix: ${{ needs.setup.outputs.splitchill-ai-package-file-name-prefix }}
          package-artifact-name-prefix: ${{ needs.setup.outputs.splitchill-ai-package-artifact-name-prefix }}

  push-linux-docker:
    needs:
      - setup
      - build-linux-docker-and-package-x86
      - build-linux-docker-and-package-arm
    if: ${{ needs.setup.outputs.docker-push == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/push-linux-docker
        with:
          docker-image-name: ${{ needs.setup.outputs.docker-image-name }}
          docker-username: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          docker-bake-meta-file-path: ${{ needs.setup.outputs.splitchill-ai-docker-bake-meta-file-path }}
          docker-bake-meta-artifact-name: ${{ needs.setup.outputs.splitchill-ai-docker-bake-meta-artifact-name }}
          docker-bake-digests-file-path: ${{ needs.setup.outputs.splitchill-ai-docker-digests-file-path }}
          docker-bake-digests-artifact-name-prefix: ${{ needs.setup.outputs.splitchill-ai-docker-digests-artifact-name-prefix }}
          docker-image-tags: ${{ needs.setup.outputs.docker-tags }}

  build-windows-backend:
    needs:
      - setup
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-windows-backend
        with:
          build-unix-time: ${{ needs.setup.outputs.build-unix-time }}
          build-date: ${{ needs.setup.outputs.build-date }}
          check-3rd-api: ${{ vars.CHECK_3RD_API }}
          skip-tests: ${{ vars.SKIP_TESTS }}
          backend-artifact-name-prefix: ${{ needs.setup.outputs.splitchill-ai-backend-artifact-name-prefix }}

  build-windows-package:
    needs:
      - setup
      - build-windows-backend
      - build-linux-docker-and-package-x86
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/build-windows-package
        with:
          package-file-name-prefix: ${{ needs.setup.outputs.splitchill-ai-package-file-name-prefix }}
          package-artifact-name-prefix: ${{ needs.setup.outputs.splitchill-ai-package-artifact-name-prefix }}
          backend-artifact-name-prefix: ${{ needs.setup.outputs.splitchill-ai-backend-artifact-name-prefix }}
