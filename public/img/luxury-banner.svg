<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040810" />
      <stop offset="40%" stop-color="#06131A" />
      <stop offset="70%" stop-color="#041814" />
      <stop offset="100%" stop-color="#020B0D" />
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emeraldGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Accent Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FFFBEB" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Emerald Shimmer -->
    <linearGradient id="emeraldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Title Gradient with Animation -->
    <linearGradient id="animatedTitleGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="75%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#FFFFFF" />
      <animate attributeName="x1" from="-100%" to="0%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="100%" to="200%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="luxuryGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="40" cy="0" r="1" fill="#F59E0B" fill-opacity="0.25" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: 'Cinzel', 'Playfair Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, serif;
      font-weight: 800;
      letter-spacing: 7px;
      text-transform: uppercase;
    }
    .brand-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.04); }
    }
    .pulsing-nebula {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center center;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="380" rx="16" fill="url(#luxuryGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="600" cy="150" r="320" fill="url(#emeraldGlow)" class="pulsing-nebula" />
  <circle cx="600" cy="90" r="180" fill="url(#goldGlow)" />

  <!-- Geometric Luxury Border Accent -->
  <rect x="12" y="12" width="1176" height="356" rx="12" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="16, 6" />
  <rect x="18" y="18" width="1164" height="344" rx="10" fill="none" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.2" />

  <!-- Corner Regal Flourishes -->
  <g stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.65">
    <!-- Top Left -->
    <path d="M 28 42 L 42 28 L 56 28" />
    <circle cx="28" cy="42" r="2" fill="#F59E0B" />
    <!-- Top Right -->
    <path d="M 1172 42 L 1158 28 L 1144 28" />
    <circle cx="1172" cy="42" r="2" fill="#F59E0B" />
    <!-- Bottom Left -->
    <path d="M 28 338 L 42 352 L 56 352" />
    <circle cx="28" cy="338" r="2" fill="#F59E0B" />
    <!-- Bottom Right -->
    <path d="M 1172 338 L 1158 352 L 1144 352" />
    <circle cx="1172" cy="338" r="2" fill="#F59E0B" />
  </g>

  <!-- Twinkling Diamond Stars -->
  <g fill="#FDE68A">
    <path d="M 240 75 Q 240 85 230 85 Q 240 85 240 95 Q 240 85 250 85 Q 240 85 240 75 Z" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite" />
    </path>
    <path d="M 960 90 Q 960 98 952 98 Q 960 98 960 106 Q 960 98 968 98 Q 960 98 960 90 Z" opacity="0.5">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.7s" repeatCount="indefinite" />
    </path>
    <path d="M 180 250 Q 180 257 173 257 Q 180 257 180 264 Q 180 257 187 257 Q 180 257 180 250 Z" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.1s" repeatCount="indefinite" />
    </path>
    <path d="M 1020 240 Q 1020 247 1013 247 Q 1020 247 1020 254 Q 1020 247 1027 247 Q 1020 247 1020 240 Z" opacity="0.45">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Central Regal Crest / Crown Icon -->
  <g transform="translate(600, 72) scale(1.15)">
    <!-- Crown Glow Backdrop -->
    <circle cx="0" cy="0" r="32" fill="#10B981" opacity="0.2" filter="url(#softGlow)" />
    <!-- Crown Hexagon Base -->
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#091E1A" stroke="url(#goldMetallic)" stroke-width="1.5" />
    <!-- Crown Shape -->
    <path d="M -14 10 L 14 10 L 12 -4 L 6 4 L 0 -10 L -6 4 L -12 -4 Z" fill="url(#goldMetallic)" />
    <circle cx="-12" cy="-6" r="1.5" fill="#FFFFFF" />
    <circle cx="0" cy="-12" r="2" fill="#FFFFFF" />
    <circle cx="12" cy="-6" r="1.5" fill="#FFFFFF" />
    <!-- Diamond Inset -->
    <polygon points="0,-1 4,5 0,11 -4,5" fill="#10B981" />
  </g>

  <!-- Main Luxury Title -->
  <text x="600" y="162" text-anchor="middle" class="brand-title" font-size="44" fill="url(#animatedTitleGrad)" filter="url(#softGlow)">
    SPLIT CHILL AI
  </text>
  <text x="600" y="162" text-anchor="middle" class="brand-title" font-size="44" fill="url(#animatedTitleGrad)">
    SPLIT CHILL AI
  </text>

  <!-- Executive Tagline -->
  <text x="600" y="202" text-anchor="middle" class="brand-subtitle" font-size="13" fill="#A7F3D0" opacity="0.95">
    INTELLIGENT FINANCIAL HARMONY &bull; DEBT OPTIMIZATION ENGINE &bull; ENTERPRISE LEDGER
  </text>

  <!-- Decorative Golden Accent Line -->
  <g transform="translate(350, 222)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="url(#goldMetallic)" stroke-width="1" opacity="0.6" />
    <polygon points="250,-4 254,0 250,4 246,0" fill="#F59E0B" />
    <line x1="300" y1="0" x2="500" y2="0" stroke="url(#goldMetallic)" stroke-width="1" opacity="0.6" />
  </g>

  <!-- Luxury Feature Badges / Pills -->
  <g transform="translate(600, 280)" filter="url(#badgeShadow)">
    <!-- Pill 1: O(N log N) Algorithm -->
    <g transform="translate(-400, 0)">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="#061A17" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="20" cy="19" r="6" fill="#10B981" opacity="0.3" />
      <circle cx="20" cy="19" r="3" fill="#10B981" />
      <text x="100" y="23" text-anchor="middle" class="pill-text" fill="#E2E8F0">Smart Minimizer</text>
    </g>

    <!-- Pill 2: 17 SQLite Tables -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="0" width="185" height="38" rx="19" fill="#061A17" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="20" cy="19" r="6" fill="#F59E0B" opacity="0.3" />
      <circle cx="20" cy="19" r="3" fill="#F59E0B" />
      <text x="102" y="23" text-anchor="middle" class="pill-text" fill="#E2E8F0">17 Unified Tables</text>
    </g>

    <!-- Pill 3: SMTP OTP & 2FA -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="185" height="38" rx="19" fill="#061A17" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="20" cy="19" r="6" fill="#10B981" opacity="0.3" />
      <circle cx="20" cy="19" r="3" fill="#34D399" />
      <text x="102" y="23" text-anchor="middle" class="pill-text" fill="#E2E8F0">Gmail SMTP OTP</text>
    </g>

    <!-- Pill 4: Mobile & Desktop PWA -->
    <g transform="translate(215, 0)">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="#061A17" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="20" cy="19" r="6" fill="#F59E0B" opacity="0.3" />
      <circle cx="20" cy="19" r="3" fill="#FCD34D" />
      <text x="100" y="23" text-anchor="middle" class="pill-text" fill="#E2E8F0">PWA &amp; LAN 0.0.0.0</text>
    </g>
  </g>

  <!-- Bottom Metallic Trim Glow -->
  <path d="M 200 378 L 1000 378" stroke="url(#animatedTitleGrad)" stroke-width="1.5" opacity="0.75" />
</svg>
