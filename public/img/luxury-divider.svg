<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 48" width="100%" height="48">
  <defs>
    <linearGradient id="divLineGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="divLineGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="divGemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left Tapering Beam -->
  <line x1="80" y1="24" x2="450" y2="24" stroke="url(#divLineGradLeft)" stroke-width="1.5" />
  <!-- Right Tapering Beam -->
  <line x1="550" y1="24" x2="920" y2="24" stroke="url(#divLineGradRight)" stroke-width="1.5" />

  <!-- Center Gem Glow -->
  <circle cx="500" cy="24" r="22" fill="url(#divGemGlow)">
    <animate attributeName="r" values="18;24;18" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Flanking Diamond Ornaments -->
  <g fill="#10B981" opacity="0.8">
    <polygon points="468,24 472,21 476,24 472,27" />
    <polygon points="524,24 528,21 532,24 528,27" />
  </g>

  <!-- Center Diamond Seal -->
  <g transform="translate(500, 24)">
    <polygon points="0,-10 10,0 0,10 -10,0" fill="#041C16" stroke="#F59E0B" stroke-width="1.5" />
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#34D399" />
    <circle cx="0" cy="0" r="1.5" fill="#FFFBEB">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
